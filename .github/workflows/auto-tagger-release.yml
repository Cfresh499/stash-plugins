name: Build and Release Auto-Tagger Plugin

on:
  push:
    tags:
      - 'auto-tagger-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Create plugin package
        run: |
          mkdir -p build/auto-tagger
          cp -r auto-tagger/* build/auto-tagger/
          cd build
          zip -r ../auto-tagger.zip auto-tagger/
      
      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(sha256sum auto-tagger.zip | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
      
      - name: Update index.yml with SHA256
        run: |
          sed -i "s|download: https://github.com/Cfresh499/stash-plugins/releases/download/auto-tagger-v1.0.0/auto-tagger.zip|download: https://github.com/Cfresh499/stash-plugins/releases/download/${{ github.ref_name }}/auto-tagger.zip|g" index.yml
          sed -i "s/sha256: \"\"/sha256: \"${{ steps.sha256.outputs.sha256 }}\"/g" index.yml
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: auto-tagger.zip
          body: |
            # Auto Tagger Plugin
            
            Stash media server plugin for automatically tagging new scenes.
            
            ## Installation
            
            Extract to `~/.stash/plugins/auto-tagger/` and reload plugins.
            
            ## SHA256
            `${{ steps.sha256.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit updated index.yml
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yml
          git commit -m "Update index.yml with auto-tagger SHA256"
          git push
        continue-on-error: true
